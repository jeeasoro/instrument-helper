<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument Helper — getting started</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<style>
  .section-title {
    font-size: 17px; text-transform: none; letter-spacing: -0.01em;
    color: var(--text); font-weight: 650; margin: 0 0 14px;
  }
  #sections p { margin: 0 0 12px; max-width: 66ch; }
  #sections p:last-of-type { margin-bottom: 0; }
  #sections b { color: var(--text); font-weight: 650; }
  .diagram {
    background: var(--panel-2); border-radius: 9px;
    padding: 10px; margin-bottom: 16px; overflow-x: auto;
  }
  .callout {
    margin-top: 14px; padding: 11px 14px; border-left: 3px solid var(--accent);
    background: var(--panel-2); border-radius: 0 7px 7px 0;
    font-size: 13px; color: var(--muted);
  }
  .callout b { color: var(--text); }
  #toc {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px;
  }
  #toc a {
    font-size: 12px; text-decoration: none; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px;
  }
  #toc a:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 id="learnTitle">Getting started</h1>
    <div class="controls" style="margin:0;gap:10px">
      <label class="field"><span data-i18n="common.instrument">Instrument</span>
        <select id="instrument">
          <option value="guitar" data-i18n="common.guitar"></option>
          <option value="piano" data-i18n="common.piano"></option>
          <option value="lyre" data-i18n="common.lyre"></option>
          <option value="kalimba" data-i18n="common.kalimba"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="lang.label">Language</span>
        <select id="lang">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
  </div>
  <p class="sub" id="learnSub"></p>

  <nav class="nav">
    <a href="./index.html" data-i18n="nav.tuner">Tuner</a>
    <a href="./songs.html" data-i18n="nav.songs">Songs</a>
    <a href="./practice.html" data-i18n="nav.practice">Practice</a>
    <a href="./learn.html" class="active" data-i18n="nav.learn">Getting started</a>
  </nav>

  <div id="toc"></div>
  <div id="sections"></div>
</div>
<script type="module" src="./src/learn.js"></script>
</body>
</html>
